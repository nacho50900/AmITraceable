# Proyecto Python del backend, gestionado con uv (https://docs.astral.sh/uv/).
# Sustituye a requirements.txt / requirements-dev.txt / requirements-vision.txt:
#   - `dependencies`                        -> antes requirements.txt
#   - `[dependency-groups] dev`             -> antes requirements-dev.txt
#   - `[project.optional-dependencies] vision` -> antes requirements-vision.txt
# `uv.lock` (versionado) congela las versiones exactas resueltas a partir de
# estos rangos. Para actualizar: `uv lock --upgrade` (todo) o
# `uv lock --upgrade-package <paquete>` (uno).
[project]
name = "amitraceable-backend"
version = "0.1.0"
description = "Backend de AmITraceable (FastAPI): analisis de exposicion de identidad digital."
# Solo 3.12: es la version de la imagen Docker y de CI. Fijarla aqui evita el
# problema documentado de resolver con otro Python (p. ej. 3.14 en local, sin
# wheels de spaCy/scikit-learn/torch para esa version): uv descargara 3.12 solo.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "spacy>=3.7,<3.9",
    # Modelos de spaCy para el fingerprinting de escritura (ES/EN). Antes se
    # instalaban con `python -m spacy download ...`, que llama a `pip` -- un
    # entorno de uv no lo trae. Ahora son dependencias normales (por URL del
    # wheel oficial), asi que `uv sync` los deja listos, tambien en CI/Docker.
    # La version del modelo debe coincidir con la minor de spaCy (3.8.x).
    "en-core-web-sm",
    "es-core-news-sm",
    "scikit-learn>=1.5,<1.7",
    "numpy>=1.26,<3.0",
    # pandas: dependencia real de app/vision/geolocation.py (metadatos del
    # indice FAISS, _index_meta, se manejan como DataFrame) y de
    # scripts/build_faiss_index.py. No es solo para tests: en cuanto el indice
    # de geolocalizacion este construido, _lazy_load() la importa en produccion.
    "pandas>=2.0,<3.0",
    # Pillow: dependencia real de app/vision/geolocation.py -- decodifica cada
    # foto descargada en memoria en cuanto hay al menos una publicacion
    # candidata, incluso antes de comprobar si el indice FAISS existe.
    # OJO: torch/faiss/transformers estan en el extra `vision`, NO aqui, pero
    # tambien hacen falta EN EL ANALISIS (embedding de cada foto + consulta al
    # indice), no solo para construir el indice. Para que la geolocalizacion
    # funcione en un backend desplegado con Docker hay que instalar el extra
    # `vision` en esa imagen -- ver ARG WITH_GEOLOCATION del Dockerfile. El
    # codigo se degrada solo (sin romper nada) si faltan.
    "pillow>=10.0,<12.0",
    "itsdangerous>=2.2,<3.0",
    "emoji>=2.13,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "prometheus-fastapi-instrumentator>=7.0,<9.0",
    # maigret: motor real de comprobacion de existencia de username en miles de
    # sitios (app/osint/username_correlation.py). Se llama a su funcion de
    # libreria de bajo nivel con is_parsing_enabled=False e
    # is_enrich_enabled=False -- nunca se activa su modo "dossier" ni sus
    # peticiones de "enrich", y no se usa su bucle de recursion (vive en su
    # CLI). Ver el docstring de ese modulo para el detalle de esta decision.
    "maigret>=0.6,<0.7",
]

[project.optional-dependencies]
# Modulo OPCIONAL de geolocalizacion por imagen y analisis visual (ver
# app/vision/geolocation.py, scene_analysis.py, nlp/translation.py).
# Deliberadamente fuera de `dependencies`: son pesadas (varios cientos de MB) y
# la mayoria de instalaciones no las necesitan. Instalar con:
#   uv sync --extra vision
# En Docker: `docker compose build --build-arg WITH_GEOLOCATION=true backend`.
#
# NO incluye `llama-cpp-python`: se compila desde codigo fuente con CUDA para
# Turing (compute capability 7.5) en la etapa `cuda-builder` del Dockerfile y se
# instala ahi (el wheel precompilado con CUDA moria con SIGILL en la GTX 1650).
vision = [
    # torch: build CUDA 12.1 (indice `pytorch-cu121`, ver [tool.uv.sources]).
    # float16 (no bfloat16) para GPU Turing (GTX 1650, cc 7.5): ver el
    # comentario largo en app/vision/scene_analysis.py. cu121 = ventana amplia
    # de compatibilidad de drivers NVIDIA; ajustar si `nvidia-smi` reporta otra
    # version de CUDA y da problemas.
    "torch>=2.2,<3.0",
    # transformers: ahora solo lo usa DINOv2 (geolocation.py), ya no Moondream2
    # (se carga via llama-cpp-python). Pin heredado de la ventana de versiones
    # de cuando se publico la revision de Moondream2 usada; probablemente
    # toleraria un rango mas amplio -- revisar si da problemas de compatibilidad.
    "transformers>=4.48,<4.54",
    "faiss-cpu>=1.8,<2.0",
    # Traduccion LOCAL de descripciones de fotos (app/nlp/translation.py,
    # ADR-31): MarianMT convertido a CTranslate2 (~516MB de RAM en CPU con int8
    # frente a ~2.3GB con transformers+torch directos).
    # sentencepiece: tokenizacion de los modelos ya convertidos.
    "ctranslate2>=4.0,<5.0",
    "sentencepiece>=0.2,<1.0",
    # Dependencias EXCLUSIVAS de scripts/geolocalization/build_flickr_index.py
    # y build_commons_index.py (ingestion de fuentes externas para ampliar el
    # indice FAISS) -- solo scripts offline, no el backend en produccion.
    # opencv-python-headless (no opencv-python): servidores/CI sin entorno
    # grafico. imagehash: phash para descartar fotos casi duplicadas.
    "opencv-python-headless>=4.8,<5.0",
    "imagehash>=4.3,<5.0",
]

[dependency-groups]
# `uv sync` instala el grupo `dev` por defecto (en Docker se excluye con --no-dev).
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "respx>=0.21,<1.0",
]

[tool.uv]
# Aplicacion, no libreria: uv no intenta construir/instalar el proyecto en si.
package = false
# Solo las plataformas reales de uso (Docker/CI en Linux, desarrollo en
# Windows). Sin esto uv resuelve tambien macOS, donde el indice cu121 de torch
# no tiene wheels.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
# explicit: solo `torch` sale de este indice; el resto de paquetes sigue en PyPI.
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Aviso interno de spaCy/click sobre una API que cambiará en Click 9.0.
    # No afecta a nuestro código; se silencia solo para limpiar la salida.
    "ignore:Importing 'parser.split_arg_string' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/__pycache__/*"]

[tool.coverage.xml]
output = "coverage.xml"
