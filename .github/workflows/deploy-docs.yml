name: Deploy docs to GitHub Pages

on:
  push:
    branches: [develop]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Set up Java (para PlantUML/asciidoctor-diagram)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Graphviz y PlantUML
        run: sudo apt-get update && sudo apt-get install -y graphviz plantuml

      - name: Install Asciidoctor gems
        run: gem install asciidoctor asciidoctor-diagram

      - name: Build documentation
        run: |
          cd docs
          rm -rf build
          asciidoctor -D build -a imagesdir=./images -r asciidoctor-diagram index.adoc
          cp -R images build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build
