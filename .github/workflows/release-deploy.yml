name: Release — Test, Build, Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.event.release.tag_name }}

jobs:
  test-webapp:
    name: Run webapp unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          cd webapp
          npm ci

      - name: Run tests
        run: |
          cd webapp
          npm test

  test-backend:
    name: Run backend (Python) unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # Grupo `dev` + modelos de spaCy incluidos (son dependencias del proyecto).
        run: cd backend && uv sync --locked

      - name: Run tests
        run: cd backend && uv run --locked pytest --junitxml=junit.xml

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6

        if: always()
        with:
          report_paths: backend/junit.xml
          job_summary: true
          detailed_summary: true
          require_tests: true

  e2e:
    name: Run E2E tests
    runs-on: ubuntu-latest
    needs: [test-webapp, test-backend]
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Use uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        # El E2E arranca el backend con `uv run uvicorn ...` (ver
        # webapp/package.json, start:all); los modelos de spaCy ya vienen en
        # las dependencias del proyecto.
        run: cd backend && uv sync --locked
      - name: Install webapp dependencies
        run: |
          cd webapp
          npm ci
      - name: Install Playwright browsers
        run: |
          cd webapp
          npm run test:e2e:install-browsers
      - name: Run E2E tests (start servers and run cucumber)
        env:
          # El backend exige estas variables para arrancar (ver
          # backend/app/config.py: Settings falla en el import si faltan).
          # Los escenarios E2E no ejercitan la OAuth real de Reddit, solo
          # necesitan que el proceso levante -- valores dummy, no
          # credenciales reales.
          REDDIT_CLIENT_ID: dummy_client_id
          REDDIT_CLIENT_SECRET: dummy_client_secret
          REDDIT_REDIRECT_URI: http://localhost:3000/auth/reddit/callback
          SESSION_SECRET_KEY: dummy_ci_session_secret_key
        run: |
          cd webapp
          npm run test:e2e

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        
        if: always()
        with:
          report_paths: webapp/e2e-results.xml
          job_summary: true
          detailed_summary: true
          require_tests: true

  # Construye las imagenes EN PARALELO con los tests (sin `needs`) y las sube
  # con el tag del commit (nunca `latest`: eso solo ocurre en `publish-images`,
  # tras pasar los tests y el E2E). Asi el tiempo de release deja de ser
  # "tests + E2E + build" y pasa a ser "max(tests + E2E, build)".
  #
  # Cache de capas en el propio ghcr (tag `buildcache`, type=registry) en vez de
  # la cache de GitHub Actions: esta tiene un limite de 10 GB por repositorio y
  # las capas de torch/CUDA por si solas lo revientan. Con la cache caliente,
  # una release que solo toca codigo reconstruye unicamente `COPY app` (segundos)
  # en vez de recompilar llama-cpp-python con CUDA y volver a bajar torch.
  build-images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: webapp
            context: webapp
    env:
      IMAGE: ghcr.io/nacho50900/amitraceable-${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (tag = commit SHA)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          # Sin build-args, igual que antes con elgohr/Publish-Docker-Github-Action:
          # el backend se publica con WITH_GEOLOCATION=false (el valor por
          # defecto del Dockerfile), NO con el `true` de docker-compose.yml. Sin
          # VITE_API_URL en el webapp: usa rutas relativas (ver webapp/nginx.conf).

  # Solo re-etiqueta (sin reconstruir nada, segundos) las imagenes ya construidas
  # arriba, y solo despues de que pasen tests unitarios y E2E.
  publish-images:
    name: Publish images (latest + release tag)
    runs-on: ubuntu-latest
    needs: [e2e, build-images]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images as latest and as the release tag
        run: |
          for image in backend webapp; do
            docker buildx imagetools create \
              --tag "ghcr.io/nacho50900/amitraceable-${image}:latest" \
              --tag "ghcr.io/nacho50900/amitraceable-${image}:${IMAGE_TAG}" \
              "ghcr.io/nacho50900/amitraceable-${image}:${GITHUB_SHA}"
          done
