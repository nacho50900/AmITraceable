name: Release — Test, Build, Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.event.release.tag_name }}

jobs:
  test-webapp:
    name: Run webapp unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd webapp
          npm ci

      - name: Run tests
        run: |
          cd webapp
          npm test

  test-backend:
    name: Run backend (Python) unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install spaCy models
        run: |
          python -m spacy download en_core_web_sm
          python -m spacy download es_core_news_sm

      - name: Run tests
        run: cd backend && pytest --junitxml=junit.xml

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: backend/junit.xml
          job_summary: true
          detailed_summary: true
          require_tests: true

  e2e:
    name: Run E2E tests
    runs-on: ubuntu-latest
    needs: [test-webapp, test-backend]
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install spaCy models
        run: |
          python -m spacy download en_core_web_sm
          python -m spacy download es_core_news_sm
      - name: Install webapp dependencies
        run: |
          cd webapp
          npm ci
      - name: Install Playwright browsers
        run: |
          cd webapp
          npm run test:e2e:install-browsers
      - name: Run E2E tests (start servers and run cucumber)
        env:
          # El backend exige estas variables para arrancar (ver
          # backend/app/config.py: Settings falla en el import si faltan).
          # Los escenarios E2E no ejercitan la OAuth real de Reddit, solo
          # necesitan que el proceso levante -- valores dummy, no
          # credenciales reales.
          REDDIT_CLIENT_ID: dummy_client_id
          REDDIT_CLIENT_SECRET: dummy_client_secret
          REDDIT_REDIRECT_URI: http://localhost:3000/auth/reddit/callback
          SESSION_SECRET_KEY: dummy_ci_session_secret_key
        run: |
          cd webapp
          npm run test:e2e

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: webapp/e2e-results.xml
          job_summary: true
          detailed_summary: true
          require_tests: true

  docker-push-backend:
    name: Publish backend image
    runs-on: ubuntu-latest
    needs: e2e
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish to Registry (backend)
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          name: nacho50900/amitraceable-backend
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          workdir: backend

  docker-push-webapp:
    name: Publish webapp image
    runs-on: ubuntu-latest
    needs: e2e
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish to Registry (webapp)
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          name: nacho50900/amitraceable-webapp
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          workdir: webapp
          # Sin VITE_API_URL: la imagen usa rutas relativas de por sí (ver
          # webapp/nginx.conf, que proxea /auth y /api hacia "backend" por
          # DNS interno de Docker) -- funciona igual en local que aquí, sin
          # necesitar DEPLOY_HOST para esto.
